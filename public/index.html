<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="툭">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<title>툭</title>
</head>
<body>
<header id="top">
  <div id="bc"></div>
  <button id="srchBtn" class="circ" aria-label="검색"></button>
  <button id="homeBtn" class="circ" aria-label="홈"></button>
</header>
<main id="main"></main>
<form id="bar" autocomplete="off">
  <button type="button" id="photoBtn" class="circ lg" aria-label="사진 올리기"></button>
  <textarea id="inp" rows="1" placeholder="툭 던져두기" enterkeyhint="send"></textarea>
  <button type="submit" id="sendBtn" class="circ lg dark" aria-label="저장"></button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</form>
<div id="sheet" hidden><div class="scrim"></div><div class="panel"></div></div>
<div id="toast" role="status"></div>
<script src="/app.js" defer></script>
</body>
</html>
