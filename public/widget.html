<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>툭 위젯</title>
<link rel="manifest" href="/widget.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f3f2ef;--tx:#1b1b1a;--tx2:#6b6a66;--tx3:#a3a19b;--soft:rgba(0,0,0,.055);--dark:#1b1b1a;--ondark:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--tx:#efeee9;--tx2:#a8a69f;--tx3:#6e6c66;--soft:rgba(255,255,255,.07);--dark:#efeee9;--ondark:#121211;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
body{padding:10px 12px 12px}
#hd{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px;font-size:12px;font-weight:600}
#hd a{color:var(--tx3);text-decoration:none;font-weight:400;font-size:11px}
#nd{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 12px}
.chip{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:var(--tint,var(--soft))}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);flex:none}
.d{display:flex;gap:10px;padding:2px 0}
.d+.d{margin-top:6px}
.l{width:26px;flex:none;text-align:center;padding-top:3px;line-height:1;color:var(--tx3)}
.l b{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.l i{font-style:normal;font-size:9.5px;display:block;margin-top:2px}
.d.today .l{color:var(--tx)}.d.today .l b{font-weight:700}.d.today .l i{font-weight:600}
.c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.e{display:flex;gap:7px;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;cursor:pointer;background:var(--tint,var(--soft))}
.e .t{font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;flex:none}
.e .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.done{opacity:.35}.done .n,.chip.done{text-decoration:line-through}
.past{opacity:.5}
body{padding-bottom:70px}
#add{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:6px 12px 10px}
#add input{width:100%;border:0;background:none;font:inherit;font-size:13px;color:var(--tx);outline:none;padding:6px 2px}
#add input::placeholder{color:var(--tx3)}
#cats{display:flex;align-items:center;gap:8px;padding:2px 2px 4px}
#cats[hidden]{display:none}
.cd{width:12px;height:12px;border-radius:50%;border:0;padding:0;cursor:pointer;opacity:.3}
.cd.on{opacity:1;transform:scale(1.2)}
#cn{font-size:10.5px;color:var(--tx3);margin-left:2px}
#hint{font-size:10.5px;color:var(--tx3);padding:0 2px;min-height:14px}
@media (max-width:300px){body{padding:6px 7px 64px}.d{gap:6px}.l{width:20px}.l b{font-size:11.5px}.e,.chip{font-size:11px;height:21px;padding:0 6px;gap:5px}.e .t{font-size:9.5px}.dot{width:5px;height:5px}#nd{gap:3px}#add{padding:4px 7px 7px}#add input{font-size:12px}}
#msg{font-size:12px;color:var(--tx3);padding:20px 4px;text-align:center}
#msg input{display:block;width:100%;margin-top:8px;font:inherit;font-size:13px;padding:6px;border:0;border-bottom:1px solid var(--tx3);background:none;color:var(--tx);outline:none;text-align:center}
</style>
</head>
<body>
<div id="hd"><span id="tdy"></span><span><a id="mini" href="#" title="작은 창으로">작게</a>&nbsp;&nbsp;<a href="/" target="_blank">툭</a></span></div>
<div id="nd"></div>
<div id="ag"></div>
<div id="msg" hidden></div>
<form id="add" autocomplete="off"><div id="cats" hidden></div><input id="ai" placeholder="할 일 툭 던지기  (내일 3시 치과)"><div id="hint"></div></form>
<script type="module">
import * as R from '/recur.mjs';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let key = ''; try { key = localStorage.getItem('tuk_key') || ''; } catch (e) {}
const ev = new Map();
const api = (p, o = {}) => fetch('/api/' + p, { ...o, headers: { 'x-tuk-key': key, 'content-type': 'application/json' } });
const has = e => e.cat && e.cat !== 'etc';
const dot = e => `<i class="dot"${has(e) ? ` style="background:${R.catColor(e.cat)}"` : ''}></i>`;
const tint = (el, e) => { if (has(e)) el.style.setProperty('--tint', `color-mix(in srgb, ${R.catColor(e.cat)} 16%, transparent)`); };
function askKey() {
  const m = $('#msg'); m.hidden = false; m.innerHTML = '비밀키<input type="password" autofocus>';
  m.querySelector('input').onkeydown = x => { if (x.key === 'Enter') { key = x.target.value.trim(); try { localStorage.setItem('tuk_key', key); } catch (e) {} m.hidden = true; load(); } };
}
async function load() {
  if (!key) return askKey();
  try {
    const r = await api('s/sync?since=0'); if (r.status === 401) return askKey();
    const j = await r.json(); ev.clear(); j.items.forEach(i => { if (!i.deleted) ev.set(i.id, i); }); draw();
  } catch (e) {}
}
// 두 번 탭(더블클릭) = 완료
async function toggle(e) { e.done = !e.done; e.updated = Date.now(); draw(); try { await api('s/push', { method: 'POST', body: JSON.stringify({ items: [e] }) }); } catch (x) {} }
function bind(el, e) { el.ondblclick = () => toggle(e); }
function draw() {
  const now = Date.now(), t0 = R.dayStart(now);
  $('#tdy').textContent = R.fmtDay(now);
  const nd = $('#nd'); nd.innerHTML = '';
  [...ev.values()].filter(e => e.start == null && !e.done).sort((a, b) => b.updated - a.updated).forEach(e => { const c = document.createElement('div'); c.className = 'chip'; c.innerHTML = dot(e) + `<span>${esc(e.title)}</span>`; tint(c, e); bind(c, e); nd.append(c); });
  const by = new Map();
  for (const e of ev.values()) for (const o of R.occurrences(e, t0, t0 + 14 * R.DAY)) { const k = R.dayStart(o); if (!by.has(k)) by.set(k, []); by.get(k).push({ e, o }); }
  const ag = $('#ag'); ag.innerHTML = '';
  [...by.keys()].sort((a, b) => a - b).forEach(k => {
    const p = R.kstParts(k), row = document.createElement('div'); row.className = 'd' + (k === t0 ? ' today' : '') + (p.wd === 0 || p.wd === 6 ? ' we' : '');
    row.innerHTML = `<div class="l"><b>${p.d}</b><i>${k === t0 ? '오늘' : '일월화수목금토'[p.wd]}</i></div><div class="c"></div>`;
    by.get(k).sort((a, b) => a.o - b.o || (a.e.updated || 0) - (b.e.updated || 0)).forEach(({ e, o }) => {
      const x = document.createElement('div'); x.className = 'e' + (e.done ? ' done' : '') + (!e.allDay && o < now ? ' past' : '');
      tint(x, e); x.innerHTML = `${dot(e)}${e.allDay ? '' : `<span class="t">${R.fmtTime(o)}</span>`}<span class="n">${esc(e.title)}</span>`; bind(x, e); row.querySelector('.c').append(x);
    });
    ag.append(row);
  });
  if (!by.size && !nd.children.length) { $('#ag').innerHTML = '<div id="msg">2주 안에 일정 없음</div>'; }
}
// 던지기: 날짜·시간은 글에서 읽고, 없으면 날짜 없는 줄로
let cat = 'etc';
const cats = $('#cats'), ai = $('#ai'), hint = $('#hint');
R.CATS.forEach(([k, label, col]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'cd' + (k === cat ? ' on' : ''); b.style.background = col; b.title = label; b.onclick = () => { cat = k; [...cats.querySelectorAll('.cd')].forEach(c => c.classList.toggle('on', c === b)); $('#cn').textContent = label; ai.focus(); }; cats.append(b); });
cats.insertAdjacentHTML('beforeend', '<span id="cn">기타</span>');
const showCats = () => { cats.hidden = !(document.activeElement === ai || ai.value); };
ai.addEventListener('focus', showCats); ai.addEventListener('blur', () => setTimeout(showCats, 150));
ai.addEventListener('input', () => {
  const t = ai.value.trim(); if (!t) { hint.textContent = ''; return; }
  const q = R.parseKo(t);
  hint.textContent = q.start == null ? '날짜 없이' : R.fmtDay(q.start) + (q.allDay ? '' : ' ' + R.fmtTime(q.start)) + '  ·  ' + (q.title || t);
});
$('#add').onsubmit = async e => {
  e.preventDefault(); const t = ai.value.trim(); if (!t) return;
  const q = R.parseKo(t), start = q.start, allDay = start == null ? true : q.allDay;
  const remind = start == null ? [] : allDay ? [{ k: 'morn', v: '08:00' }] : [{ k: 'morn', v: '08:30' }, { k: 'min', v: 60 }];
  const it = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), title: q.title || t, body: '', start, allDay, repeat: null, remind, cat, done: false, updated: Date.now(), deleted: false };
  ai.value = ''; hint.textContent = ''; ev.set(it.id, it); draw();
  try { await api('s/push', { method: 'POST', body: JSON.stringify({ items: [it] }) }); } catch (x) { hint.textContent = '저장 실패 — 다시 시도'; ai.value = t; }
};
// 설치형 앱 창은 크롬이 최소 크기를 막아둠 → 팝업 창으로 열면 훨씬 작게 줄어듦
$('#mini').onclick = e => { e.preventDefault(); const w = window.open('/widget?mini', 'tukmini', 'popup,width=250,height=420,left=' + (screen.availWidth - 270) + ',top=80'); if (w) w.focus(); };
if (location.search.includes('mini')) $('#mini').hidden = true;
load();
setInterval(() => { if (document.activeElement !== ai) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
window.addEventListener('focus', load);
</script>
</body>
</html>
