<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>툭 위젯</title>
<link rel="manifest" href="/widget.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f3f2ef;--tx:#1b1b1a;--tx3:#a3a19b;--dark:#1b1b1a;--ondark:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--tx:#efeee9;--tx3:#6e6c66;--dark:#efeee9;--ondark:#121211;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
body{padding:8px 8px 10px}
#hd{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 8px;font-size:12px;font-weight:600}
#hd a{color:var(--tx3);text-decoration:none;font-weight:400;font-size:11px}
#nd{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 8px}
.chip{font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;background:var(--dark);color:var(--ondark);cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{display:flex;gap:8px;padding:2px 0}
.l{width:24px;flex:none;text-align:center;padding-top:4px;line-height:1}
.l b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums}
.l i{font-style:normal;font-size:9px;color:var(--tx3)}
.d.today .l i{color:var(--tx);font-weight:600}
.c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.e{display:flex;gap:6px;align-items:center;height:22px;padding:0 7px;border-radius:5px;background:var(--dark);color:var(--ondark);font-size:11.5px;cursor:pointer}
.e .t{font-size:10px;opacity:.6;font-variant-numeric:tabular-nums;flex:none}
.e .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.done{opacity:.3}.done .n,.chip.done{text-decoration:line-through}
.past{opacity:.45}
#msg{font-size:12px;color:var(--tx3);padding:20px 4px;text-align:center}
#msg input{display:block;width:100%;margin-top:8px;font:inherit;font-size:13px;padding:6px;border:0;border-bottom:1px solid var(--tx3);background:none;color:var(--tx);outline:none;text-align:center}
</style>
</head>
<body>
<div id="hd"><span id="tdy"></span><a href="/" target="_blank">툭</a></div>
<div id="nd"></div>
<div id="ag"></div>
<div id="msg" hidden></div>
<script type="module">
import * as R from '/recur.mjs';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let key = ''; try { key = localStorage.getItem('tuk_key') || ''; } catch (e) {}
const ev = new Map();
const api = (p, o = {}) => fetch('/api/' + p, { ...o, headers: { 'x-tuk-key': key, 'content-type': 'application/json' } });
function paint(el, e) { if (e.cat && e.cat !== 'etc') { el.style.background = R.catColor(e.cat); el.style.color = '#fff'; } }
function askKey() {
  const m = $('#msg'); m.hidden = false; m.innerHTML = '비밀키<input type="password" autofocus>';
  m.querySelector('input').onkeydown = x => { if (x.key === 'Enter') { key = x.target.value.trim(); try { localStorage.setItem('tuk_key', key); } catch (e) {} m.hidden = true; load(); } };
}
async function load() {
  if (!key) return askKey();
  try {
    const r = await api('s/sync?since=0'); if (r.status === 401) return askKey();
    const j = await r.json(); ev.clear(); j.items.forEach(i => { if (!i.deleted) ev.set(i.id, i); }); draw();
  } catch (e) {}
}
// 두 번 탭(더블클릭) = 완료
async function toggle(e) { e.done = !e.done; e.updated = Date.now(); draw(); try { await api('s/push', { method: 'POST', body: JSON.stringify({ items: [e] }) }); } catch (x) {} }
function bind(el, e) { el.ondblclick = () => toggle(e); }
function draw() {
  const now = Date.now(), t0 = R.dayStart(now);
  $('#tdy').textContent = R.fmtDay(now);
  const nd = $('#nd'); nd.innerHTML = '';
  [...ev.values()].filter(e => e.start == null && !e.done).sort((a, b) => b.updated - a.updated).forEach(e => { const c = document.createElement('div'); c.className = 'chip'; c.textContent = e.title; paint(c, e); bind(c, e); nd.append(c); });
  const by = new Map();
  for (const e of ev.values()) for (const o of R.occurrences(e, t0, t0 + 14 * R.DAY)) { const k = R.dayStart(o); if (!by.has(k)) by.set(k, []); by.get(k).push({ e, o }); }
  const ag = $('#ag'); ag.innerHTML = '';
  [...by.keys()].sort((a, b) => a - b).forEach(k => {
    const p = R.kstParts(k), row = document.createElement('div'); row.className = 'd' + (k === t0 ? ' today' : '');
    row.innerHTML = `<div class="l"><b>${p.d}</b><i>${k === t0 ? '오늘' : '일월화수목금토'[p.wd]}</i></div><div class="c"></div>`;
    by.get(k).sort((a, b) => a.o - b.o || (a.e.allDay ? -1 : 1)).forEach(({ e, o }) => {
      const x = document.createElement('div'); x.className = 'e' + (e.done ? ' done' : '') + (!e.allDay && o < now ? ' past' : '');
      x.innerHTML = `${e.allDay ? '' : `<span class="t">${R.fmtTime(o)}</span>`}<span class="n">${esc(e.title)}</span>`;
      paint(x, e); bind(x, e); row.querySelector('.c').append(x);
    });
    ag.append(row);
  });
  if (!by.size && !nd.children.length) { $('#ag').innerHTML = '<div id="msg">2주 안에 일정 없음</div>'; }
}
load();
setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
window.addEventListener('focus', load);
</script>
</body>
</html>
